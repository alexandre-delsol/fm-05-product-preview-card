<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap"
    rel="stylesheet">
  <title>Frontend Mentor | Product preview card component</title>
</head>

<body>
  <main>

    <picture>
      <source media="(max-width: 600px)" srcset="./images/image-product-mobile.jpg">
      <img src="./images/image-product-desktop.jpg" alt="Gabrielle Essence Eau De Parfum">
    </picture>

    <div class="text-container">
      <p class="perfume">PERFUME</p>
      <h1>Gabrielle Essence Eau De Parfum</h1>
      <p class="paragraph">
        A floral, solar and voluptuous interpretation
        composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL.
      </p>
      <p>
        <span class="price">$149.99</span>
        <span class="promo">$169.99</span>
      </p>

      <button type="button"><img src="./images/icon-cart.svg" alt=""> Add to Cart</button>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io/profile/alexandre-delsol">Frontend Mentor</a>.
    Coded by <a href="https://github.com/alexandre-delsol">Alexandre DELSOL</a>.
  </footer>
</body>

</html>
